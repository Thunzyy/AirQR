name: airqr_mobile
description: "Air-gapped file transfer using animated QR codes."
publish_to: "none"

version: 1.0.0+10

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_rust_bridge: 2.11.1
  mobile_scanner: ^7.1.3
  rust_lib_airqr_mobile:
    path: rust_builder
  path_provider: ^2.1.5
  file_picker: ^8.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  wakelock_plus: ^1.2.8
  device_info_plus: ^10.1.0
  flutter_file_dialog: ^3.0.2
  archive: ^3.6.1
  image: ^4.3.0
  http: ^1.2.0
  path: ^1.9.0
  web_socket_channel: ^3.0.1
  flutter_lite_camera: ^0.0.2
  zxing2: ^0.2.4
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  msix: ^3.18.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/web/airqr-portable.html
    - assets/icons/lucide/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

msix_config:
  display_name: AirQR
  publisher_display_name: SenTent
  identity_name: SenTent.AirQR
  publisher: CN=5C0FDEB8-F6D7-4FBA-907B-578E36D8A3D6
  # Microsoft Store requires the fourth (revision) segment to be zero.
  msix_version: 1.0.10.0
  logo_path: ../../assets/icon-512.png
  capabilities: internetClient, privateNetworkClientServer, webcam
  languages: en-us, fr-fr
  architecture: x64
  output_path: ../../dist/WindowsStore
  output_name: AirQR-windows-x64-store
  store: true
  sign_msix: false
  install_certificate: false
