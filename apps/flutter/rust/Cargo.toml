[package]
name = "rust_lib_airqr_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
airqr-core = { path = "../../../packages/airqr-core", default-features = false, features = ["flutter_rust_bridge"] }
qrcodegen = "1.8"
raptorq = "2.0.0"
gif = "0.13"
rayon = "1.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rand = "0.8"
flate2 = "1.0"
rxing = { version = "0.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["gif"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Cargokit builds this crate independently, including in nested release staging.
[workspace]
