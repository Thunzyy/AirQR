[package]
name = "airqr-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[example]]
name = "encode"
required-features = ["desktop"]

[[example]]
name = "encode_1bit"
required-features = ["desktop"]

[[example]]
name = "encode_1bit_webp"
required-features = ["desktop"]

[[example]]
name = "encode_binary"
required-features = ["desktop"]

[[example]]
name = "encode_streaming"
required-features = ["desktop"]

[[example]]
name = "encode_svg"
required-features = ["desktop"]

[[example]]
name = "encode_to_mp4"
required-features = ["desktop"]

[dependencies]
qrcodegen = "1.8"
zstd = { version = "0.13", optional = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
thiserror = "1.0"
anyhow = "1.0"
flutter_rust_bridge = { version = "=2.11.1", optional = true }
lazy_static = "1.5.0"
raptorq = "2.0.0"
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
webp = { version = "0.3", optional = true }
flate2 = "1.0"
brotli = "7.0"
rayon = "1.8"
gif = "0.13"
log = "0.4.29"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
indicatif = "0.17"
rqrr = "0.7"
crossterm = "0.29"
ctrlc = "3.4"

[features]
default = ["wasm"]
desktop = ["zstd", "flutter_rust_bridge", "zip", "webp"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
wasm-threads = ["wasm", "dep:wasm-bindgen-rayon"]
flutter_rust_bridge = ["dep:flutter_rust_bridge"]
